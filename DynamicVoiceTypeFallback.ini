[Logging]
; trace, debug, info, warning, error, critical, off
; info  = load, hooks, VoiceType map
; debug = per-line Speak (also needs Speak=true and a matching toggle below)
Level = info

; Master switch for per-line Speak blocks
Speak = true

; Only log when the voice path was actually rewritten (fallback / fallback_recon)
OnlyWhenReplaced = false

; Log Fuz Ro D-oh stub lines (Stock_*.xwm path, preFuz, recon success or miss)
FuzRoDoh = true

; Current file missing and we did not replace (the "why is this silent?" cases)
Misses = true

; Nothing to do: same VoiceType, or the current VoiceType file already exists
Unchanged = false
